<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" role="img" aria-label="Architecture and delegation diagram of Summer Internship Coach" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Drawn from the code: backend/main.py (routes, incl. /api/preferences, /api/scout/web, /api/applications/{id}/people),
       backend/db.py set_prefs (profile + one card per target), backend/intake.py (shield, router), backend/agents/*.py
       (agents, their tools and the built-in web search), backend/keeper.py (the only writer; verify_web reads each web
       result's page), backend/config.py (limits). Colours match the app's team strip. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <style>
      .t  { font-size: 11.5px; font-weight: 700; fill: #1d1d1f; }
      .d  { font-size: 9px; fill: #3a3a3c; }
      .dm { font-size: 8.6px; fill: #3a3a3c; font-family: ui-monospace, Menlo, monospace; }
      .web { font-size: 8.6px; fill: #0a6e2e; font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
      .w  { font-size: 9px; fill: #6e6e73; }
      .h  { font-size: 8px; font-weight: 700; fill: #8e8e93; letter-spacing: .6px; }
      .ln { stroke: #6e6e73; stroke-width: 1.1; fill: none; }
      .code { fill: #f2f2f7; stroke: #aeaeb2; stroke-width: 1; }
      .trig { fill: #ffffff; stroke: #d1d1d6; stroke-width: 1; }
    </style>
  </defs>

  <!-- column headers -->
  <text class="h" x="6" y="9">THE STUDENT</text>
  <text class="h" x="122" y="9">CODE FIRST</text>
  <text class="h" x="232" y="9">AI AGENT (gpt-6-luna)</text>
  <text class="h" x="452" y="9">RESULT</text>

  <!-- Lane 1: new account: preferences form, then the Setup guide -->
  <rect class="trig" x="4" y="16" width="104" height="62" rx="8"/>
  <text class="t" x="12" y="34" style="font-size:10.5px">New account</text>
  <text class="d" x="12" y="48">1 · preferences form</text>
  <text class="d" x="12" y="60">2 · Setup tab</text>
  <rect class="code" x="122" y="16" width="96" height="62" rx="8"/>
  <text class="t" x="130" y="33" style="font-size:10.5px">Profile</text>
  <text class="d" x="130" y="47">read by every</text>
  <text class="d" x="130" y="59">agent; a card per</text>
  <text class="d" x="130" y="71">target (0 tokens)</text>
  <rect x="232" y="16" width="206" height="62" rx="8" fill="#e8f8ec" stroke="#34c759" stroke-width="1.4"/>
  <text class="t" x="242" y="34">Setup guide</text>
  <text class="dm" x="242" y="49">connection_status · next_setup_step</text>
  <text class="d" x="242" y="64">load_skill: 12 setup playbooks</text>
  <rect class="trig" x="452" y="16" width="184" height="62" rx="8"/>
  <text class="d" x="460" y="36">One step per channel, next to a live</text>
  <text class="d" x="460" y="49">checklist. It cannot click, read your</text>
  <text class="d" x="460" y="62">accounts or send anything.</text>
  <path class="ln" d="M108,47 H120" marker-end="url(#arr)"/>
  <path class="ln" d="M218,47 H230" marker-end="url(#arr)"/>
  <path class="ln" d="M438,47 H450" marker-end="url(#arr)"/>

  <!-- Lane 2: intake -->
  <rect class="trig" x="4" y="92" width="104" height="58" rx="8"/>
  <text class="t" x="12" y="111" style="font-size:10.5px">Add what's new</text>
  <text class="d" x="12" y="125">paste · upload · link</text>
  <text class="d" x="12" y="138">or Coach Connector</text>
  <rect class="code" x="122" y="92" width="96" height="58" rx="8"/>
  <text class="t" x="130" y="111" style="font-size:10.5px">Shield + Router</text>
  <text class="d" x="130" y="125">hidden text and</text>
  <text class="d" x="130" y="138">injected lines out</text>
  <rect x="232" y="92" width="206" height="58" rx="8" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.4"/>
  <text class="t" x="242" y="110">Inbox organizer</text>
  <text class="d" x="242" y="125">one model call per text: roles, people,</text>
  <text class="d" x="242" y="138">dated facts, each with its exact quote</text>
  <path class="ln" d="M108,121 H120" marker-end="url(#arr)"/>
  <path class="ln" d="M218,121 H230" marker-end="url(#arr)"/>
  <path class="ln" d="M438,121 H450" marker-end="url(#arr)"/>

  <!-- Lane 3: discovery (whole web + job boards) -->
  <rect class="trig" x="4" y="162" width="104" height="76" rx="8"/>
  <text class="t" x="12" y="181" style="font-size:10.5px">Find openings</text>
  <text class="d" x="12" y="195">the whole web, or</text>
  <text class="d" x="12" y="207">my organisations'</text>
  <text class="d" x="12" y="219">job boards</text>
  <rect x="232" y="162" width="206" height="76" rx="8" fill="#e5f1ff" stroke="#0a84ff" stroke-width="1.4"/>
  <text class="t" x="242" y="179">Opportunity scout</text>
  <text class="web" x="242" y="193">web search</text>
  <text class="d" x="300" y="193">(OpenAI built-in): ≤8 roles</text>
  <text class="dm" x="242" y="206">search_job_boards</text>
  <text class="d" x="336" y="206">public APIs:</text>
  <text class="d" x="242" y="218">Greenhouse, Lever, Ashby, SmartRecruiters</text>
  <text class="dm" x="242" y="230">read_careers_page</text>
  <text class="d" x="336" y="230">≤3 pages, shielded</text>
  <path class="ln" d="M108,200 H230" marker-end="url(#arr)"/>
  <path class="ln" d="M438,200 H450" marker-end="url(#arr)"/>

  <!-- Records keeper spans lanes 2 and 3 -->
  <rect class="code" x="452" y="92" width="184" height="146" rx="8" style="stroke:#8e8e93;stroke-width:1.4"/>
  <text class="t" x="462" y="110">Records keeper</text>
  <text class="w" x="462" y="122">code, 0 tokens, the only writer</text>
  <text class="d" x="462" y="137">• every quote, name, link and record</text>
  <text class="d" x="470" y="148">id checked against its source</text>
  <text class="d" x="462" y="161">• web results: opens each page, keeps</text>
  <text class="d" x="470" y="172">it only if the page shows it; never</text>
  <text class="d" x="470" y="183">LinkedIn, Handshake, 12twenty</text>
  <text class="d" x="462" y="196">• merge rules, data checks; rejects</text>
  <text class="d" x="470" y="207">what it cannot back, with the reason</text>
  <text class="d" x="462" y="222" style="font-weight:600">→ Opportunities · Networking ·</text>
  <text class="d" x="474" y="233" style="font-weight:600">Action plan (derived in code)</text>

  <!-- Lane 4: Career coach -->
  <rect class="trig" x="4" y="252" width="104" height="70" rx="8"/>
  <text class="t" x="12" y="278" style="font-size:10.5px">Plan my week</text>
  <text class="t" x="12" y="293" style="font-size:10.5px">Ask your coach</text>
  <rect class="code" x="122" y="252" width="96" height="70" rx="8"/>
  <text class="t" x="130" y="272" style="font-size:10.5px">Candidates</text>
  <text class="d" x="130" y="286">open actions from</text>
  <text class="d" x="130" y="298">code; the coach</text>
  <text class="d" x="130" y="310">only ranks them</text>
  <rect x="232" y="252" width="206" height="70" rx="8" fill="#efefff" stroke="#5e5ce6" stroke-width="1.8"/>
  <text class="t" x="242" y="269">Career coach <tspan style="font-weight:500;fill:#5e5ce6">(boss)</tspan></text>
  <text class="dm" x="242" y="283">ask_opportunity_scout</text>
  <text class="dm" x="242" y="295">ask_network_intel · get_data_checks</text>
  <text class="web" x="242" y="308">web search</text>
  <text class="dm" x="298" y="308">· load_skill · save_draft</text>
  <rect class="trig" x="452" y="252" width="184" height="31" rx="8"/>
  <text class="d" x="460" y="265">Ranked plan: every action cites the</text>
  <text class="d" x="460" y="277">record ids it relied on (checked)</text>
  <rect x="452" y="289" width="184" height="33" rx="8" fill="#fff1f0" stroke="#ff6961" stroke-width="1"/>
  <text class="d" x="460" y="303" style="font-weight:600">Outbox: drafts only (≤2 per request)</text>
  <text class="d" x="460" y="315">never sent by the app</text>
  <path class="ln" d="M108,287 H120" marker-end="url(#arr)"/>
  <path class="ln" d="M218,287 H230" marker-end="url(#arr)"/>
  <path class="ln" d="M438,268 H450" marker-end="url(#arr)"/>
  <path class="ln" d="M438,305 H450" marker-end="url(#arr)"/>

  <!-- Delegation to the specialists -->
  <path class="ln" d="M300,322 L232,366" marker-start="url(#arr)" marker-end="url(#arr)" style="stroke:#5e5ce6;stroke-width:1.4"/>
  <path class="ln" d="M378,322 L378,366" marker-start="url(#arr)" marker-end="url(#arr)" style="stroke:#5e5ce6;stroke-width:1.4"/>
  <text class="dm" x="170" y="342" style="fill:#5e5ce6">ask_network_intel</text>
  <text class="dm" x="384" y="347" style="fill:#5e5ce6">ask_opportunity_scout</text>

  <!-- Lane 5: specialists -->
  <rect class="trig" x="4" y="368" width="104" height="76" rx="8"/>
  <text class="t" x="12" y="386" style="font-size:10.5px">Key people</text>
  <text class="t" x="12" y="400" style="font-size:10.5px">and alumni</text>
  <text class="d" x="12" y="414">Who can open</text>
  <text class="d" x="12" y="426">the door</text>
  <text class="d" x="12" y="438">Prepare my call</text>
  <rect x="122" y="368" width="196" height="76" rx="8" fill="#e3f7fa" stroke="#30b0c7" stroke-width="1.4"/>
  <text class="t" x="131" y="385">Network intelligence</text>
  <text class="web" x="131" y="399">web search</text>
  <text class="d" x="185" y="399">: key people and alumni</text>
  <text class="d" x="131" y="411">at a target; a person's background</text>
  <text class="d" x="131" y="424">doors, call prep: the 10 best-</text>
  <text class="d" x="131" y="436">matching people (BM25) or a dossier</text>
  <rect x="328" y="368" width="110" height="76" rx="8" fill="#e5f1ff" stroke="#0a84ff" stroke-width="1.4"/>
  <text class="t" x="335" y="386" style="font-size:10.5px">Opportunity scout</text>
  <text class="d" x="335" y="401">answers the coach</text>
  <text class="d" x="335" y="413">from the 10 best-</text>
  <text class="d" x="335" y="425">matching roles</text>
  <text class="d" x="335" y="437">(BM25)</text>
  <path class="ln" d="M108,406 H120" marker-end="url(#arr)"/>
  <text class="w" x="452" y="378">Routed in code: people, doors and call</text>
  <text class="w" x="452" y="390">prep go straight to Network intelligence.</text>
  <text class="w" x="452" y="404">People from the web: saved only if a</text>
  <text class="w" x="452" y="416">public page names them; "alum" is the</text>
  <text class="w" x="452" y="428">agent's reading; no contact details.</text>
  <text class="w" x="452" y="442">Delegation one level deep, ≤4 questions.</text>

  <!-- Bottom band -->
  <rect x="4" y="458" width="632" height="44" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
  <rect x="14" y="469" width="11" height="11" rx="3" fill="#efefff" stroke="#5e5ce6"/>
  <text class="d" x="30" y="478">AI agent: gpt-6-luna via the course Portkey key, reasoning effort low, ≤8,000 output tokens per answer,</text>
  <text class="d" x="30" y="489">caps per run; every call logged (input / cached / output tokens, web searches).</text>
  <text class="web" x="30" y="499" style="font-size:8px">web search</text>
  <text class="d" x="82" y="499" style="font-size:8px">OpenAI's built-in tool, $0.01 per search; the search buttons stop at 20 web requests per student a day.</text>
  <rect x="502" y="469" width="11" height="11" rx="3" class="code"/>
  <text class="d" x="518" y="478">Code: 0 tokens,</text>
  <text class="d" x="518" y="489">same result every time</text>
</svg>
